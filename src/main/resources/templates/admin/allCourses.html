    <link href='/user/plugins/fontawesome-5.15.2/css/fontawesome.min.css' rel='stylesheet'>
    <link href='/user/plugins/animate/animate.css' rel='stylesheet'>


    <link href='/user/plugins/select2/css/select2.min.css' rel='stylesheet'>
    <link href='/user/plugins/no-ui-slider/nouislider.min.css' rel='stylesheet'>


    <!-- Fonts -->
    <link href="css?family=Dosis:300,400,600,700|Open+Sans:300,400,600,700" rel="stylesheet">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->

    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->


    <style>
        .center {
            text-align: center;
        }

        .pagination {
            display: inline-block;
        }

        .pagination a {
            color: black;
            float: left;
            padding: 8px 16px;
            text-decoration: none;
            transition: background-color .3s;
            border: 1px solid #ddd;
            margin: 0 4px;
        }

        .pagination a.active {
            background-color: #e05625;
            color: white;
            border: 1px solid #e86f17;
        }

        .pagination a:hover:not(.active) {
            background-color: #ddd;
        }


        .styled-table {
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 0.9em;
            font-family: sans-serif;
            min-width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        }

        .styled-table thead tr {
            background-color: #dc9459;
            color: #ffffff;
            text-align: left;
        }

        .styled-table th,
        .styled-table td {
            padding: 12px 15px;
        }

        .styled-table tbody tr {
            border-bottom: 1px solid #dddddd;
        }

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }

        .styled-table tbody tr:last-of-type {
            border-bottom: 2px solid #9292f6;
        }

        .styled-table tbody tr.active-row {
            font-weight: bold;
            color: #e78022;
        }
    </style>
</head>

<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0">
<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/headerFragment::header"></header>

<div class="main-wrapper course-list-left-sidebar">


    <!-- ====================================
    ———	BREADCRUMB
    ===================================== -->
    <section class="breadcrumb-bg" style="background-image: url(/user/img/background/page-title-bg-img.jpg); ">
        <div class="container">
            <div class="breadcrumb-holder">
                <div>
                    <h2 class="breadcrumb-title">ADMIN</h2>
                    <h1 class="breadcrumb-title">All Courses</h1>
                    <ul class="breadcrumb breadcrumb-transparent">
                        <li class="breadcrumb-item">
                            <a class="text-white" href="/admin/home">Home</a>
                        </li>
                        <li class="breadcrumb-item text-white active" aria-current="page">
                            <a href="/admin/addCourse">ADD COURSE</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ====================================
    ———	COURSES SECTION
    ===================================== -->

    <div class="card shadow-none bg-transparent">
        <table class="styled-table">
            <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Start date</th>
                <th>Years old</th>
                <th>Available seats</th>
                <th>Duration</th>
                <th>Price</th>
                <th>Currency</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody th:each="course : ${allCourse}">
            <tr>
                <td th:text="${course.id}"></td>
                <td th:text="${course.courseName}"></td>
                <td th:text="${#dates.format(course.startDate, 'dd-MM-yyyy')}"></td>
                <td th:text="${course.yearsOld}"></td>
                <td th:text="${course.availableSeats}"></td>
                <td th:text="${#strings.substringBefore(course.getDuration() , '.')}"></td>
                <td th:text="${#strings.substringBefore(course.getPrice() , '.')}"></td>
                <td th:text="${course.currency}"></td>
                <td><a th:href="@{'/courses/update/' + ${course.id}}">Update</a> </td>
                <td><a th:href="@{'/courses/delete/' + ${course.id}}">Delete</a></td>
            </tr>
            </tbody>
        </table>

    </div>


</div> <!-- element wrapper ends -->

<!-- ====================================
———	FOOTER
===================================== -->

<footer th:replace="fragment/footerFragment::footer"></footer>
