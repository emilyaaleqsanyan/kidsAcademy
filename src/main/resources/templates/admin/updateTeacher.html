<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0" >

<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/adminHeaderFragment::adminHeader"></header>
<div class="main-wrapper home">

  <form method="post" action="/admin/updateTeacher" enctype="multipart/form-data">

    Photo:<input type="file"  name="picName" ><br><br>
    Id:<input type ="hidden" name="id" th:value="${teacher.getId()}">
    Name:<input type="text" name="name"  th:value="${teacher.getName()}"><br><br>
    Surname:<input type ="text" name="surname" th:value="${teacher.getSurname()}"><br><br>
    Course: <select name="course.id"> <option  th:each="course:${courses}" th:text="${course.getCourseName()}" th:value="${course.getId()}" ></option>
  </select><br><br>
    Info:<input type="text" name="information"  th:value="${teacher.getInformation()}" ><br><br>
    <input type="submit" value="Update" >
  </form>
</div>

<footer th:replace="fragment/footerFragment::footer"></footer>


<!-- Javascript -->
<script src='/user/plugins/jquery/jquery.min.js'></script>
<script src='/user/plugins/bootstrap/js/bootstrap.bundle.min.js'></script>
