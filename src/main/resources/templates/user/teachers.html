<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>

    <!-- Site Tittle -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teachers - Kidz</title>

    <!-- Plugins css Style -->
    <link href='/user/plugins/fontawesome-5.15.2/css/all.min.css' rel='stylesheet'>
    <link href='/user/plugins/fontawesome-5.15.2/css/fontawesome.min.css' rel='stylesheet'>
    <link href='/user/plugins/animate/animate.css' rel='stylesheet'>



    <link href='/user/plugins/owl-carousel/owl.carousel.min.css' rel='stylesheet' media='screen'>
    <link href='/user/plugins/owl-carousel/owl.theme.default.min.css' rel='stylesheet' media='screen'>




    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Dosis:300,400,600,700|Open+Sans:300,400,600,700" rel="stylesheet">

    <!-- Custom css -->
    <link href="/user/css/kidz.css" id="option_style" rel="stylesheet">

    <!-- Favicon -->
    <link href="/user/img/favicon.png" rel="shortcut icon">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        .center {
            text-align: center;
        }

        .pagination {
            display: inline-block;
        }

        .pagination a {
            color: black;
            float: left;
            padding: 8px 16px;
            text-decoration: none;
            transition: background-color .3s;
            border: 1px solid #ddd;
            margin: 0 4px;
        }

        .pagination a.active {
            background-color: #e05625;
            color: white;
            border: 1px solid #e86f17;
        }

        .pagination a:hover:not(.active) {
            background-color: #ddd;
        }
    </style>
</head>

<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0">
<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/headerFragment::header"></header>
<div class="main-wrapper home">

    <!-- ====================================
    ———	BREADCRUMB
    ===================================== -->
    <section class="breadcrumb-bg" style="background-image: url(/user/img/background/page-title-bg-img.jpg); ">
        <div class="container">
            <div class="breadcrumb-holder">
                <div>
                    <h1 class="breadcrumb-title">Teachers</h1>
                    <ul class="breadcrumb breadcrumb-transparent">
                        <li class="breadcrumb-item">
                            <a class="text-white" >Home</a>
                        </li>
                        <li class="breadcrumb-item text-white active" aria-current="page">
                            Teachers
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ====================================
    ———	OUR TEACHER 1
    ===================================== -->

    <!-- ====================================
    ———	OUR TEACHER 3
    ===================================== -->
    <div class="section-title justify-content-center mb-4 mb-md-8">
        <span class="shape shape-left bg-info"></span>
        <h2 class="text-danger">Our Teachers </h2>
        <span class="shape shape-right bg-info"></span>
    </div>

    <section  class="py-10" th:each="teacher:${teachers}">
        <div class="container" >


            <div class="row">
                <div class="col-sm-6 col-xs-12 mb-7 mb-md-8 mb-lg-9">

                    <div class="media media-avator-view flex-column flex-sm-row">
                        <a class="media-img mb-5 mb-sm-0 me-md-5 me-lg-6 rounded-sm shadow-sm">
                            <img class="rounded-sm"  th:src="@{/getImage(picName=${teacher.getPhoto().getName()})}" alt="avator-img1.jpg" >
                        </a>
                        <div class="media-body">
                            <a class="font-size-20 font-weight-medium d-inline-block mb-1" th:href="@{'/teachers/'+${teacher.getId()}}"  th:text="${teacher.getName()}" ></a>
                            <a class="font-size-20 font-weight-medium d-inline-block mb-1" th:href="@{'/teachers/'+${teacher.getId()}}" th:text="${teacher.getSurname()}" ></a>

                            <span class="text-muted font-size-15 mb-1 d-block" th:text="${teacher.getCourse().getCourseName()}">"English Teacher></span>
                            <p th:text="${teacher.getInformation()}">"They must explain to you how all this mistaken idea of denouncing pleasure and praising pain was born and I will give you.</p>

                        </div>
                    </div>
                </div>



            </div>



        </div>

    </section>

</div> <!-- element wrapper ends -->
<section class="py-5">
    <div class="center">
        <nav aria-label="Page navigation example">
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center align-items-center">
                    <div th:if="${teachers.totalPages > 0}" class="pagination"
                         th:each="pageNumber : ${pageNumbers}">
                        <a th:href="@{/teachers(size=${teachers.size}, page=${pageNumber})}"
                           th:text="${pageNumber}"
                           th:class="${pageNumber ==teachers.number +1} ? active"></a>
                    </div>
                </ul>
            </nav>
        </nav>
    </div>
</section>
<!-- ====================================
———	FOOTER
===================================== -->
<footer th:replace="fragment/footerFragment::footer"></footer>


<!-- Javascript -->
<script src='/user/plugins/jquery/jquery.min.js'></script>
<script src='/user/plugins/bootstrap/js/bootstrap.bundle.min.js'></script>





<script src='/user/plugins/lazyestload/lazyestload.js'></script>
<script src='/user/plugins/velocity/velocity.min.js'></script>
<script src='/user/plugins/smoothscroll/SmoothScroll.js'></script>


<script src='/user/plugins/owl-carousel/owl.carousel.min.js'></script>

<script src='/user/plugins/revolution/js/extensions/revolution.extension.navigation.min.js'></script>

<script src='/user/plugins/wow/wow.min.js'></script>

<script>
    var d = new Date();
    var year = d.getFullYear();
    document.getElementById("copy-year").innerHTML = year;
</script>
<script src='/user/js/kidz.js'></script>
<link href="/user/options/optionswitch.css" rel="stylesheet">
<script src="/user/options/optionswitcher.js"></script>
</body>

</html>
