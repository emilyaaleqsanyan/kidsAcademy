<head>

    <!-- Site Tittle -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up Or Log In </title>

    <!-- Plugins css Style -->
    <link href='/user/plugins/fontawesome-5.15.2/css/all.min.css' rel='stylesheet'>
    <link href='/user/plugins/fontawesome-5.15.2/css/fontawesome.min.css' rel='stylesheet'>
    <link href='/user/plugins/animate/animate.css' rel='stylesheet'>


    <!-- Fonts -->
    <link href="css?family=Dosis:300,400,600,700|Open+Sans:300,400,600,700" rel="stylesheet">

    <!-- Custom css -->
    <link href="/user/css/kidz.css" id="option_style" rel="stylesheet">

    <!-- Favicon -->
    <link href="/user/img/favicon.png" rel="shortcut icon">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>

<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0">
<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/headerFragment::header"></header>


<div class="main-wrapper home">

    <!-- ====================================
    ——— BREADCRUMB
    ===================================== -->
    <section class="breadcrumb-bg" style="background-image: url(/user/img/background/page-title-bg-img.jpg); ">
        <div class="container">
            <div class="breadcrumb-holder">
                <div>
                    <h1 class="breadcrumb-title">Sign Up Or Log In</h1>
                    <ul class="breadcrumb breadcrumb-transparent">
                        <li class="breadcrumb-item">
                            <a class="text-white" href="index.html">Home</a>
                        </li>
                        <li class="breadcrumb-item text-white active" aria-current="page">
                            Sign Up Or Log In
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ====================================
    ——— SIGN-UP OR LOG-IN
    ===================================== -->
    <section class="py-8 py-md-10">
        <div class="container">
            <div class="row">
                <div class="col-sm-6 offset-lg-2 col-lg-4">
                    <div class="mb-4 mb-sm-0">
                        <div class="bg-primary rounded-top p-2">
                            <h3 class="text-white font-weight-bold mb-0 ms-2">Create An Account</h3>
                            <p style="color: red" th:text="${msg}"></p>
                        </div>

                        <div class="border rounded-bottom-sm border-top-0">
                            <div class="p-3">
                                <form action="/user/register" method="POST" role="form">
                                    <div class="form-group form-group-icon">
                                        <input type="text" name="name" class="form-control border" placeholder="Name"
                                               required>
                                    </div>

                                    <div class="form-group form-group-icon">
                                        <input type="text" name="Surname" class="form-control border"
                                               placeholder="Surname" required>
                                    </div>

                                    <div class="form-group form-group-icon">
                                        <input type="text" name="email" class="form-control border" placeholder="Email"
                                               required>
                                    </div>

                                    <div class="form-group form-group-icon">
                                        <input type="password" name="password" class="form-control border"
                                               placeholder="Password" required>
                                    </div>


                                    <div class="form-group">
                                        <button type="submit" class="btn btn-danger text-uppercase w-100">Register
                                        </button>
                                    </div>


                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="mb-4 mb-sm-0">
                        <div class="bg-primary rounded-top p-2">
                            <h3 class="text-white font-weight-bold mb-0 ms-2">Login</h3>
                        </div>

                        <div class="border rounded-bottom-sm border-top-0">
                            <div class="p-3">
                                <form action="/login" method="POST">
                                    <div class="form-group form-group-icon">
                                        <input type="email" name="email" class="form-control border"
                                               placeholder="User name" required>
                                    </div>

                                    <div class="form-group form-group-icon">
                                        <input type="password" name="password" class="form-control border"
                                               placeholder="Password" required>
                                    </div>

                                    <div class="form-group">
                                        <button type="submit" class="btn btn-danger text-uppercase w-100">Log In
                                        </button>
                                    </div>


                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div> <!-- element wrapper ends -->

<!-- ====================================
——— FOOTER
===================================== -->
<footer th:replace="fragment/footerFragment::footer"></footer>


<!-- Javascript -->
<script src='/user/plugins/jquery/jquery.min.js'></script>

    var d = new Date();
    var year = d.getFullYear();
    document.getElementById("copy-year").innerHTML = year;
</script>
