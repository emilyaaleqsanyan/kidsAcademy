<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0">
<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/headerFragment::header"></header>
<div class="main-wrapper course-single-left-sidebar">


    <!-- ====================================
    ———	BREADCRUMB
    ===================================== -->
    <section class="breadcrumb-bg" style="background-image: url(/user/img/background/page-title-bg-img.jpg); ">
        <div class="container">
            <div class="breadcrumb-holder">
                <div>
                    <h1 class="breadcrumb-title">Schedule</h1>
                    <ul class="breadcrumb breadcrumb-transparent">
                        <li class="breadcrumb-item">
                            <a class="text-white" href="/">Home</a>
                        </li>
                        <li class="breadcrumb-item text-white active" aria-current="page">
                            Schedule
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ====================================
    ———	COURSES SECTION
    ===================================== -->
    <section class="py-8 pt-md-10">
        <div class="container">
            <div class="row">
                <div class="col-lg-9 col-md-8 order-md-1">
                    <div class="card shadow-none bg-transparent">
                        <img class="card-img-top" src="/user/img/courses/feature-course-single-title.jpg"
                             alt="Card image">

                        <div class="card-body border-top-5 border-primary position-relative">


                            <h3 class="card-title text-primary">Course Schedule</h3>
                            <div class="table-responsive table-class-schedule">
                                <table class="table table-bordered text-center">
                                    <thead>
                                    <tr>
                                        <th class="bg-primary text-white text-uppercase font-size-18" scope="col">Time
                                            <i class="fa fa-arrow-down" aria-hidden="true"></i>
                                        </th>
                                        <th class="bg-success text-white text-uppercase" scope="col">Monday</th>
                                        <th class="bg-danger text-white text-uppercase" scope="col">Tuesday</th>
                                        <th class="bg-info text-white text-uppercase" scope="col">Wednesday</th>
                                        <th class="bg-purple text-white text-uppercase" scope="col">Thursday</th>
                                        <th class="bg-pink text-white text-uppercase" scope="col">Friday</th>
                                    </tr>
                                    </thead>
                                    <tbody >
                                    <tr >
                                        <td  class="py-5 align-middle text-muted font-weight-medium">9.00 - 10.00 AM</td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('09:00') && schedule.getDay().toString().equals('MONDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-success d-block font-weight-bold font-size-18 mb-2 "></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('09:00') && schedule.getDay().toString().equals('TUESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-danger d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('09:00') && schedule.getDay().toString().equals('WEDNESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-info d-block font-weight-bold font-size-18 mb-2 "></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('09:00') && schedule.getDay().toString().equals('THURSDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-purple d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('09:00') && schedule.getDay().toString().equals('FRIDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-pink d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td class="py-5 align-middle text-muted font-weight-medium">10.00 - 11.00 AM
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('10:00') && schedule.getDay().toString().equals('MONDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}"  class="text-success d-block font-weight-bold font-size-18 mb-2 "></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('10:00') && schedule.getDay().toString().equals('TUESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-danger d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('10:00') && schedule.getDay().toString().equals('WEDNESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-info d-block font-weight-bold font-size-18 mb-2 "></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('10:00') && schedule.getDay().toString().equals('THURSDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-purple d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('10:00') && schedule.getDay().toString().equals('FRIDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-pink d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td class="py-5 align-middle text-muted font-weight-medium">11.00 - 11.30 AM
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span  class="text-success d-block font-weight-bold font-size-18 mb-2 ">Break</span>
                                            Lunch
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span class="text-danger d-block font-weight-bold font-size-18 mb-2">Break</span>
                                            Lunch
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span class="text-info d-block font-weight-bold font-size-18 mb-2">Break</span>
                                            Lunch
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span class="text-purple d-block font-weight-bold font-size-18 mb-2">Break</span>
                                            Lunch
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span class="text-pink d-block font-weight-bold font-size-18 mb-2">Break</span>
                                            Lunch
                                        </td>
                                    </tr>

                                    <tr>
                                        <td class="py-5 align-middle text-muted font-weight-medium">11.30 - 12.30 PM
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('11:30') && schedule.getDay().toString().equals('MONDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-success d-block font-weight-bold font-size-18 mb-2  "></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('11:30') && schedule.getDay().toString().equals('TUESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-danger d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('11:30') && schedule.getDay().toString().equals('WEDNESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-info d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('11:30') && schedule.getDay().toString().equals('THURSDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-purple d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('11:30') && schedule.getDay().toString().equals('FRIDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-pink d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td class="py-5 align-middle text-muted font-weight-medium">12.30 - 13.30 PM</td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('12:30') && schedule.getDay().toString().equals('MONDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-success d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('12:30') && schedule.getDay().toString().equals('TUESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-danger d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('12:30') && schedule.getDay().toString().equals('WEDNESDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-info d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('12:30') && schedule.getDay().toString().equals('THURSDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-purple d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                        <td  class="py-5 text-muted">
                                            <span th:each="schedule: ${courseSchedule}" th:if="${schedule.getCourseStart().toString().equals('12:30') && schedule.getDay().toString().equals('FRIDAY')}"
                                                  th:text="${schedule.course.getCourseName().toUpperCase()}" class="text-pink d-block font-weight-bold font-size-18 mb-2"></span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>


                        </div>
                    </div>
                </div>


            </div>
        </div>
    </section>

</div> <!-- element wrapper ends -->
