<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org"
      xmlns:data-th="http://www.w3.org/1999/xhtml">
<head>

    <!-- Site Tittle -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Gallery - Kidz</title>

    <!-- Plugins css Style -->
    <link href='/user/plugins/fontawesome-5.15.2/css/all.min.css' rel='stylesheet'>
    <link href='/user/plugins/fontawesome-5.15.2/css/fontawesome.min.css' rel='stylesheet'>
    <link href='/user/plugins/animate/animate.css' rel='stylesheet'>

    <link href='/user/plugins/fancybox/jquery.fancybox.min.css' rel='stylesheet'>
    <link href='/user/plugins/isotope/isotope.min.css' rel='stylesheet'>








    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Dosis:300,400,600,700|Open+Sans:300,400,600,700" rel="stylesheet">

    <!-- Custom css -->
    <link href="/user/css/kidz.css" id="option_style" rel="stylesheet">

    <!-- Favicon -->
    <link href="/user/img/favicon.png" rel="shortcut icon">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>

<body id="body" class="up-scroll" data-bs-spy="scroll" data-bs-target=".element-right-sidebar" data-bs-offset="0">
<!-- ====================================
——— HEADER
===================================== -->
<header th:replace="fragment/headerFragment::header"></header>
<div class="main-wrapper photo-gallery">


    <!-- ====================================
    ———	BREADCRUMB
    ===================================== -->
    <section class="breadcrumb-bg" style="background-image: url(/user/img/background/page-title-bg-img.jpg); ">
        <div class="container">
            <div class="breadcrumb-holder">
                <div>
                    <h1 class="breadcrumb-title">Photo Gallery</h1>
                    <ul class="breadcrumb breadcrumb-transparent">
                        <li class="breadcrumb-item">
                            <a class="text-white" >Home</a>
                        </li>
                        <li class="breadcrumb-item text-white active" aria-current="page">
                            Photo Gallery
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ====================================
    ———	GALLERY
    ===================================== -->

    <section class="py-8 py-md-10">
        <div class="container" th:each="picture:${pictures}">

            <div id="gallery-grid" >
                <div class="row grid" >
                    <div class="col-md-4 col-lg-3 col-xs-12 element-item nature">
                        <div class="media media-hoverable justify-content-center">
                            <div class="position-relative w-100">
                                <img class="media-img w-100 lazyestload" data-th:src="@{/getImage(picName=${picture.getPictureName()})}" th:src="@{/getImage(picName=${picture.getPictureName()})}"  alt="gallery-img">
                                <a class="media-img-overlay" data-fancybox="gallery"  th:href="@{/getImage(picName=${picture.getPictureName()})}">
                                    <div class="btn btn-squre">
                                        <i class="fa fa-search-plus" ></i>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
          </div>
    </section>
 <!-- element wrapper ends -->
<section class="py-5">
    <div class="center">
        <nav aria-label="Page navigation example">
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center align-items-center">
                    <div th:if="${pictures.totalPages > 0}" class="pagination"
                         th:each="pageNumber : ${pageNumbers}">
                        <a th:href="@{/gallery(size=${pictures.size}, page=${pageNumber})}"
                           th:text="${pageNumber}"
                           th:class="${pageNumber ==pictures.number +1} ? active"></a>
                    </div>
                </ul>
            </nav>
        </nav>
    </div>
</section></div>
<!-- ====================================
———	FOOTER
===================================== -->
<footer th:replace="fragment/footerFragment::footer"></footer>

<

<script src='/user/plugins/jquery/jquery.min.js'></script>

<script src='/user/plugins/fancybox/jquery.fancybox.min.js'></script>
<script src='/user/plugins/isotope/isotope.min.js'></script>
<script src='/user/plugins/images-loaded/js/imagesloaded.pkgd.min.js'></script>

<script src='/user/plugins/lazyestload/lazyestload.js'></script>
<script src='/user/plugins/velocity/velocity.min.js'></script>
<script src='/user/plugins/smoothscroll/SmoothScroll.js'></script>

<script src='/user/plugins/wow/wow.min.js'></script>

    var d = new Date();
    var year = d.getFullYear();
    document.getElementById("copy-year").innerHTML = year;
</script>
<script src='/user/js/kidz.js'></script>
<link href="/user/options/optionswitch.css" rel="stylesheet">
<script src="/user/options/optionswitcher.js"></script>
</body>

</html>
